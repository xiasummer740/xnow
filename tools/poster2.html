<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=800,height=1200"><title>宣传海报 - 实时价格</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{width:800px;min-height:1200px;background:linear-gradient(160deg,#0a0e1a 0%,#111827 50%,#0a1628 100%);font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:50px 60px;position:relative;overflow:hidden}
.glow1{position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(251,191,36,0.12),transparent);border-radius:50%;pointer-events:none}
.glow2{position:absolute;bottom:-100px;left:-100px;width:350px;height:350px;background:radial-gradient(circle,rgba(59,130,246,0.1),transparent);border-radius:50%;pointer-events:none}
h1{font-size:40px;font-weight:900;color:#fff;text-align:center;margin-bottom:8px;position:relative;z-index:10}
.sub{text-align:center;color:#64748b;font-size:16px;margin-bottom:40px;position:relative;z-index:10}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative;z-index:10;margin-bottom:40px}
.item{background:rgba(15,23,42,0.8);border:1px solid rgba(71,85,105,0.2);border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}
.item-left{display:flex;align-items:center;gap:12px}
.icon{font-size:28px;flex-shrink:0}
.info h3{color:#e2e8f0;font-size:15px;font-weight:700;margin-bottom:3px}
.info span{color:#64748b;font-size:11px}
.price{text-align:right;flex-shrink:0}
.price .from{color:#64748b;font-size:10px;margin-bottom:2px}
.price .num{color:#fbbf24;font-size:22px;font-weight:900}
.price .unit{color:#64748b;font-size:11px}
.highlight{border-color:rgba(251,191,36,0.3);background:linear-gradient(135deg,rgba(251,191,36,0.05),rgba(15,23,42,0.8))}
.bottom{position:relative;z-index:10;text-align:center;background:rgba(15,23,42,0.8);border:1px solid rgba(71,85,105,0.2);border-radius:16px;padding:24px;margin-bottom:20px}
.bottom h3{color:#fff;font-size:18px;font-weight:700;margin-bottom:8px}
.bottom p{color:#94a3b8;font-size:13px;line-height:1.6}
.url{text-align:center;color:#fbbf24;font-size:24px;font-weight:900;letter-spacing:2px;position:relative;z-index:10;margin-top:10px}
.tag{display:inline-block;padding:3px 10px;background:rgba(251,191,36,0.15);color:#fbbf24;border-radius:50px;font-size:10px;font-weight:700;margin-left:6px}
</style></head><body>
<div class="glow1"></div><div class="glow2"></div>
<h1>📊 热门服务 & 实时价格</h1>
<p class="sub">全平台覆盖 · 价格随倍率实时更新 · 登录查看全部</p>
<div class="grid" id="priceGrid"><div style="color:#64748b;text-align:center;grid-column:1/-1;padding:40px">⏳ 加载实时价格中...</div></div>
<div class="bottom">
<h3>🔐 安全 · 免密码 · 秒级交付</h3>
<p>只要目标链接，不要账号密码。全自动API对接，下单后秒级启动。<br>支持微信/支付宝/USDT充值，单次500元以上免手续费。</p>
</div>
<div class="url">xnow.taikon.top</div>

<script>
(async function(){
  const grid = document.getElementById('priceGrid');
  try {
    const r = await fetch('/api/services/public');
    const d = await r.json();
    if (d.status !== 'success' || !Array.isArray(d.data)) throw new Error('API fail');

    const targets = [
      { kw:'tiktok - 刷粉', icon:'🎵', label:'TikTok 涨粉', unit:'千粉', desc:'最低价·真人粉', hot:true },
      { kw:'instagram - 粉丝', icon:'📸', label:'Instagram 涨粉', unit:'千粉', desc:'不掉粉' },
      { kw:'youtube 订阅', icon:'▶️', label:'YouTube 订阅', unit:'千粉', desc:'补粉保障' },
      { kw:'telegram - 群组', icon:'✈️', label:'Telegram 群成员', unit:'千粉', desc:'英文/中文' },
      { kw:'facebook粉丝', icon:'📘', label:'Facebook 涨粉', unit:'千粉', desc:'30天可补' },
      { kw:'twitter粉丝', icon:'🐦', label:'X / Twitter 涨粉', unit:'千粉', desc:'全球覆盖' },
      { kw:'tiktok - 视频播放', icon:'▶️', label:'TikTok 播放量', unit:'千次', desc:'秒级启动' },
      { kw:'tiktok - 视频点赞', icon:'❤️', label:'TikTok 点赞', unit:'千赞', desc:'高质量' },
    ];

    let html = '';
    for (const t of targets) {
      const candidates = d.data.filter(s => {
        const cat = (s.category||'').toLowerCase();
        return cat.includes(t.kw) && parseFloat(s.rate) > 0 && parseFloat(s.rate) < 100;
      });
      if (candidates.length > 0) {
        candidates.sort((a,b) => parseFloat(a.rate) - parseFloat(b.rate));
        const s = candidates[0];
        const cls = t.hot ? 'item highlight' : 'item';
        const hotTag = t.hot ? '<span class="tag">最热</span>' : '';
        html += `<div class="${cls}"><div class="item-left"><div class="icon">${t.icon}</div><div class="info"><h3>${t.label}${hotTag}</h3><span>${t.desc}</span></div></div><div class="price"><div class="from">起</div><div class="num">¥${s.sell_price.toFixed(2)}</div><div class="unit">/${t.unit}</div></div></div>`;
      }
    }
    grid.innerHTML = html || '<div style="color:#ef4444;text-align:center;grid-column:1/-1;padding:40px">⚠ 加载失败，请刷新重试</div>';
  } catch(e) {
    grid.innerHTML = '<div style="color:#ef4444;text-align:center;grid-column:1/-1;padding:40px">⚠ 加载失败: ' + e.message + '</div>';
  }
})();
</script>
</body></html>
