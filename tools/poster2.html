<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>价格菜单海报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0e1a; font-family:sans-serif;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; padding:10px;
}
.poster{
  width:420px; max-width:100vw;
  background:linear-gradient(160deg,#0a0e1a 0%,#111827 50%,#0a1628 100%);
  border-radius:16px; padding:36px 28px;
  color:#fff; position:relative; overflow:hidden;
}
.poster::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(251,191,36,0.05) 0%, transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(59,130,246,0.04) 0%, transparent 50%);
  pointer-events:none;
}
h1{ font-size:28px; font-weight:900; text-align:center; margin-bottom:4px; }
.sub{ text-align:center; color:#64748b; font-size:12px; margin-bottom:28px; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
.item{
  background:rgba(15,23,42,0.8); border:1px solid rgba(71,85,105,0.2);
  border-radius:10px; padding:14px 16px;
  display:flex; align-items:center; justify-content:space-between;
}
.item.hot{ border-color:rgba(251,191,36,0.3); background:linear-gradient(135deg,rgba(251,191,36,0.04),rgba(15,23,42,0.8)); }
.item-left{ display:flex; align-items:center; gap:10px; }
.icon{ font-size:26px; flex-shrink:0; }
.info h3{ color:#e2e8f0; font-size:13px; font-weight:700; margin-bottom:2px; }
.info span{ color:#64748b; font-size:10px; }
.price{ text-align:right; flex-shrink:0; }
.price .from{ color:#64748b; font-size:9px; margin-bottom:2px; }
.price .num{ color:#fbbf24; font-size:20px; font-weight:900; }
.price .unit{ color:#64748b; font-size:10px; }
.tag{ display:inline-block; padding:1px 8px; background:rgba(251,191,36,0.15); color:#fbbf24; border-radius:20px; font-size:9px; font-weight:700; margin-left:4px; }
.extra{ text-align:center; margin-bottom:18px; }
.extra span{ display:inline-block; background:rgba(15,23,42,0.8); border:1px solid rgba(71,85,105,0.2); color:#64748b; font-size:10px; padding:5px 14px; border-radius:20px; margin:3px; }
.bottom{ text-align:center; background:rgba(15,23,42,0.8); border:1px solid rgba(71,85,105,0.2); border-radius:12px; padding:18px; margin-bottom:14px; }
.bottom h3{ font-size:15px; font-weight:700; margin-bottom:6px; }
.bottom p{ color:#94a3b8; font-size:11px; line-height:1.5; }
.url{ text-align:center; color:#fbbf24; font-size:22px; font-weight:900; letter-spacing:2px; margin-top:8px; }
</style>
</head>
<body>
<div class="poster">
  <h1>📊 热门服务 & 实时价格</h1>
  <p class="sub">全平台覆盖 · 价格随倍率实时更新 · 登录查看全部</p>
  <div class="grid" id="g"><div style="color:#64748b;text-align:center;grid-column:1/-1;padding:24px;font-size:12px">加载中...</div></div>
  <div class="extra">
    <span>✨ Spotify / Discord / LinkedIn / Reddit</span>
    <span>🌐 30+国家网站流量</span>
    <span>🗺️ Google Maps 评价</span>
  </div>
  <div class="bottom">
    <h3>🔐 安全 · 免密码 · 秒级交付</h3>
    <p>只要目标链接，不要账号密码。全自动API对接，下单后秒级启动。<br>支持微信/支付宝/USDT充值，单次500元以上免手续费。</p>
  </div>
  <div class="url">xnow.taikon.top</div>
</div>
<script>
(async()=>{
  const g=document.getElementById('g');
  try{
    const r=await fetch('/api/services/public');
    const d=await r.json();
    if(d.status!=='success'||!Array.isArray(d.data))throw new Error('fail');
    const T=[
      {kw:'tiktok - 刷粉',icon:'🎵',label:'TikTok 涨粉',unit:'千粉',desc:'最低价真人粉',hot:true},
      {kw:'instagram - 粉丝',icon:'📸',label:'Instagram 涨粉',unit:'千粉',desc:'不掉粉'},
      {kw:'youtube 订阅',icon:'▶️',label:'YouTube 订阅',unit:'千粉',desc:'补粉保障'},
      {kw:'telegram - 群组',icon:'✈️',label:'Telegram 群成员',unit:'千粉',desc:'英文/中文'},
      {kw:'facebook粉丝',icon:'📘',label:'Facebook 涨粉',unit:'千粉',desc:'30天可补'},
      {kw:'twitter粉丝',icon:'🐦',label:'X/Twitter 涨粉',unit:'千粉',desc:'全球覆盖'},
      {kw:'tiktok - 视频播放',icon:'▶️',label:'TikTok 播放量',unit:'千次',desc:'秒级启动'},
      {kw:'tiktok - 视频点赞',icon:'❤️',label:'TikTok 点赞',unit:'千赞',desc:'高质量'},
    ];
    let h='';
    for(const t of T){
      const cs=d.data.filter(s=>(s.category||'').toLowerCase().includes(t.kw)&&parseFloat(s.rate)>0&&parseFloat(s.rate)<100);
      if(cs.length){
        cs.sort((a,b)=>parseFloat(a.rate)-parseFloat(b.rate));
        const s=cs[0], cls=t.hot?'item hot':'item', hotTag=t.hot?'<span class="tag">最热</span>':'';
        h+=`<div class="${cls}"><div class="item-left"><div class="icon">${t.icon}</div><div class="info"><h3>${t.label}${hotTag}</h3><span>${t.desc}</span></div></div><div class="price"><div class="from">起</div><div class="num">¥${s.sell_price.toFixed(2)}</div><div class="unit">/${t.unit}</div></div></div>`;
      }
    }
    g.innerHTML=h||'<div style="color:#ef4444;text-align:center;grid-column:1/-1;padding:24px">加载失败</div>';
  }catch(e){g.innerHTML='<div style="color:#ef4444;text-align:center;grid-column:1/-1;padding:24px">加载失败</div>';}
})();
</script>
</body>
</html>
