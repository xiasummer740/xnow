<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>价格菜单海报</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.poster{width:min(500px,90vw);aspect-ratio:9/16;background:linear-gradient(160deg,#0a0e1a 0%,#111827 50%,#0a1628 100%);border-radius:20px;padding:5% 6%;position:relative;overflow:hidden}
.glow1{position:absolute;top:-15%;right:-15%;width:50%;height:25%;background:radial-gradient(circle,rgba(251,191,36,0.08),transparent);border-radius:50%;pointer-events:none}
.glow2{position:absolute;bottom:-15%;left:-15%;width:45%;height:25%;background:radial-gradient(circle,rgba(59,130,246,0.06),transparent);border-radius:50%;pointer-events:none}
h1{font-size:clamp(20px,6vw,42px);font-weight:900;color:#fff;text-align:center;margin-bottom:6px;position:relative;z-index:10}
.sub{text-align:center;color:#64748b;font-size:clamp(11px,2.8vw,18px);margin-bottom:clamp(16px,5vw,40px);position:relative;z-index:10}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.5vw,14px);position:relative;z-index:10;margin-bottom:clamp(12px,3vw,30px)}
.item{background:rgba(15,23,42,0.8);border:1px solid rgba(71,85,105,0.2);border-radius:12px;padding:clamp(8px,2.5vw,18px) clamp(10px,3vw,22px);display:flex;align-items:center;justify-content:space-between}
.item-left{display:flex;align-items:center;gap:clamp(6px,1.5vw,12px)}
.icon{font-size:clamp(20px,5vw,34px);flex-shrink:0}
.info h3{color:#e2e8f0;font-size:clamp(10px,2.5vw,18px);font-weight:700;margin-bottom:2px}
.info span{color:#64748b;font-size:clamp(8px,1.8vw,12px)}
.price{text-align:right;flex-shrink:0}
.price .from{color:#64748b;font-size:clamp(8px,1.5vw,11px);margin-bottom:2px}
.price .num{color:#fbbf24;font-size:clamp(14px,4vw,26px);font-weight:900}
.price .unit{color:#64748b;font-size:clamp(8px,1.8vw,12px)}
.highlight{border-color:rgba(251,191,36,0.35);background:linear-gradient(135deg,rgba(251,191,36,0.06),rgba(15,23,42,0.8))}
.bottom{position:relative;z-index:10;text-align:center;background:rgba(15,23,42,0.8);border:1px solid rgba(71,85,105,0.2);border-radius:14px;padding:clamp(10px,3vw,24px);margin-bottom:clamp(8px,2vw,20px)}
.bottom h3{color:#fff;font-size:clamp(12px,3vw,20px);font-weight:700;margin-bottom:6px}
.bottom p{color:#94a3b8;font-size:clamp(9px,2vw,15px);line-height:1.5}
.url{text-align:center;color:#fbbf24;font-size:clamp(16px,4vw,28px);font-weight:900;letter-spacing:2px;position:relative;z-index:10;margin-top:clamp(4px,1vw,10px)}
.tag{display:inline-block;padding:clamp(1px,0.5vw,3px) clamp(4px,1.5vw,10px);background:rgba(251,191,36,0.15);color:#fbbf24;border-radius:50px;font-size:clamp(7px,1.5vw,11px);font-weight:700;margin-left:4px}
.extra{position:relative;z-index:10;text-align:center;margin-top:clamp(6px,2vw,20px)}
.extra span{display:inline-block;background:rgba(15,23,42,0.8);border:1px solid rgba(71,85,105,0.2);color:#64748b;font-size:clamp(8px,1.8vw,13px);padding:clamp(4px,1vw,8px) clamp(8px,2.5vw,20px);border-radius:50px;margin:3px}
</style></head><body>
<div class="poster">
<div class="glow1"></div><div class="glow2"></div>
<h1>📊 热门服务 & 实时价格</h1>
<p class="sub">全平台覆盖 · 价格随倍率实时更新 · 登录查看全部</p>
<div class="grid" id="priceGrid"><div style="color:#64748b;text-align:center;grid-column:1/-1;padding:30px;font-size:clamp(10px,2vw,16px)">⏳ 加载实时价格中...</div></div>
<div class="extra">
  <span>✨ Spotify / Discord / LinkedIn / Pinterest / Reddit</span>
  <span>🌐 30+ 国家网站流量</span>
  <span>🗺️ Google Maps 评价</span>
</div>
<div class="bottom">
<h3>🔐 安全 · 免密码 · 秒级交付</h3>
<p>只要目标链接，不要账号密码。全自动API对接，下单后秒级启动。<br>支持微信/支付宝/USDT充值，单次500元以上免手续费。</p>
</div>
<div class="url">xnow.taikon.top</div>
</div>

<script>
(async function(){
  const grid = document.getElementById('priceGrid');
  try {
    const r = await fetch('/api/services/public');
    const d = await r.json();
    if (d.status !== 'success' || !Array.isArray(d.data)) throw new Error('API fail');
    const targets = [
      { kw:'tiktok - 刷粉', icon:'🎵', label:'TikTok 涨粉', unit:'千粉', desc:'最低价·真人粉', hot:true },
      { kw:'instagram - 粉丝', icon:'📸', label:'Instagram 涨粉', unit:'千粉', desc:'不掉粉' },
      { kw:'youtube 订阅', icon:'▶️', label:'YouTube 订阅', unit:'千粉', desc:'补粉保障' },
      { kw:'telegram - 群组', icon:'✈️', label:'Telegram 群成员', unit:'千粉', desc:'英文/中文' },
      { kw:'facebook粉丝', icon:'📘', label:'Facebook 涨粉', unit:'千粉', desc:'30天可补' },
      { kw:'twitter粉丝', icon:'🐦', label:'X / Twitter 涨粉', unit:'千粉', desc:'全球覆盖' },
      { kw:'tiktok - 视频播放', icon:'▶️', label:'TikTok 播放量', unit:'千次', desc:'秒级启动' },
      { kw:'tiktok - 视频点赞', icon:'❤️', label:'TikTok 点赞', unit:'千赞', desc:'高质量' },
    ];
    let html = '';
    for (const t of targets) {
      const candidates = d.data.filter(s => {
        const cat = (s.category||'').toLowerCase();
        return cat.includes(t.kw) && parseFloat(s.rate) > 0 && parseFloat(s.rate) < 100;
      });
      if (candidates.length > 0) {
        candidates.sort((a,b) => parseFloat(a.rate) - parseFloat(b.rate));
        const s = candidates[0];
        const cls = t.hot ? 'item highlight' : 'item';
        const hotTag = t.hot ? '<span class="tag">最热</span>' : '';
        html += `<div class="${cls}"><div class="item-left"><div class="icon">${t.icon}</div><div class="info"><h3>${t.label}${hotTag}</h3><span>${t.desc}</span></div></div><div class="price"><div class="from">起</div><div class="num">¥${s.sell_price.toFixed(2)}</div><div class="unit">/${t.unit}</div></div></div>`;
      }
    }
    grid.innerHTML = html || '<div style="color:#ef4444;text-align:center;grid-column:1/-1;padding:30px">加载失败</div>';
  } catch(e) {
    grid.innerHTML = '<div style="color:#ef4444;text-align:center;grid-column:1/-1;padding:30px">加载失败</div>';
  }
})();
</script>
</body></html>
