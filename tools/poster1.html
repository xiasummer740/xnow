<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>宣传海报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#060b18; font-family:sans-serif;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; padding:10px;
}
.poster{
  width:420px; max-width:100vw;
  background:linear-gradient(135deg,#060b18 0%,#0f172a 40%,#1a0a2e 100%);
  border-radius:16px; padding:48px 36px;
  text-align:center; color:#fff;
  position:relative; overflow:hidden;
}
/* quantum glow */
.poster::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(251,191,36,0.06) 0%, transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(59,130,246,0.04) 0%, transparent 50%);
  pointer-events:none;
}
.badge{
  display:inline-block; padding:5px 18px;
  border:1px solid rgba(251,191,36,0.25); border-radius:25px;
  background:rgba(251,191,36,0.06); color:#fbbf24;
  font-size:11px; font-weight:700; letter-spacing:2px; margin-bottom:28px;
}
h1{ font-size:42px; font-weight:900; line-height:1.12; margin-bottom:14px;
  background:linear-gradient(180deg,#fff,#fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sub{ color:#94a3b8; font-size:14px; line-height:1.7; margin-bottom:36px; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:28px; }
.card{ padding:16px 14px; border:1px solid rgba(148,163,184,0.12); border-radius:10px; background:rgba(15,23,42,0.6); text-align:left; display:flex; gap:10px; align-items:flex-start; }
.card .ico{ font-size:26px; flex-shrink:0; }
.card h3{ color:#fff; font-size:13px; font-weight:700; margin-bottom:2px; }
.card p{ color:#64748b; font-size:11px; line-height:1.4; }
.big-price{ display:inline-block; background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#0f172a; font-size:22px; font-weight:900; padding:10px 28px; border-radius:30px; margin-bottom:24px; }
.btn{ display:inline-block; background:#fbbf24; color:#0f172a; font-weight:900; font-size:18px; padding:16px 48px; border-radius:14px; text-decoration:none; box-shadow:0 6px 24px rgba(251,191,36,0.3); }
.url{ color:#64748b; font-size:14px; margin-top:18px; letter-spacing:1px; }
.stars{ position:absolute; inset:0; pointer-events:none; }
.star{ position:absolute; color:rgba(251,191,36,0.06); font-family:monospace; font-size:11px; font-weight:700; animation:float 18s linear infinite; }
@keyframes float{ 0%{transform:translateY(105%) rotate(0)} 100%{transform:translateY(-5%) rotate(360deg)} }
</style>
</head>
<body>
<div class="poster">
  <div class="stars">
    <div class="star" style="left:3%;animation-delay:0s">E=mc²</div>
    <div class="star" style="left:18%;animation-delay:-6s">iħ∂ψ/∂t=Hψ</div>
    <div class="star" style="left:35%;animation-delay:-10s">e^(iπ)+1=0</div>
    <div class="star" style="left:55%;animation-delay:-4s">S=k·logW</div>
    <div class="star" style="left:72%;animation-delay:-14s">∇×E=-∂B/∂t</div>
    <div class="star" style="left:88%;animation-delay:-8s">F=ma</div>
  </div>

  <div class="badge">TIKTOK · INSTAGRAM · YOUTUBE · TELEGRAM</div>
  <h1>让你的社交媒体<br>火速出圈</h1>
  <p class="sub">粉丝 · 点赞 · 播放量 · 评论 · 转发<br>全平台覆盖 秒级交付 无需密码</p>

  <div class="grid">
    <div class="card"><div class="ico">⚡</div><div><h3>秒级自动交付</h3><p>下单后秒级启动</p></div></div>
    <div class="card"><div class="ico">💎</div><div><h3>全网最低价</h3><p id="p1">TikTok千粉 ¥--/千</p></div></div>
    <div class="card"><div class="ico">🔒</div><div><h3>安全无需密码</h3><p>只要链接 不要密码</p></div></div>
    <div class="card"><div class="ico">🛡️</div><div><h3>独立IP节点</h3><p>跨境防封必备</p></div></div>
  </div>

  <div class="big-price" id="p2">TikTok千粉最低 ¥--/千</div><br>
  <div class="btn">⚡ 立即注册体验</div>
  <div class="url">xnow.taikon.top</div>
</div>

<script>
(async()=>{
  try{
    const r=await fetch('/api/services/public');
    const d=await r.json();
    if(d.status==='success'&&Array.isArray(d.data)){
      const tk=d.data.filter(s=>(s.category||'').toLowerCase().includes('tiktok - 刷粉')&&parseFloat(s.rate)>0&&parseFloat(s.rate)<100);
      if(tk.length){tk.sort((a,b)=>parseFloat(a.rate)-parseFloat(b.rate)); const p=tk[0].sell_price.toFixed(2); document.getElementById('p1').textContent='TikTok千粉 ¥'+p+'/千'; document.getElementById('p2').textContent='TikTok千粉最低 ¥'+p+'/千';}
    }
  }catch(e){}
})();
</script>
</body>
</html>
