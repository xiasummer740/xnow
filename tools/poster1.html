<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>宣传海报</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#060b18;font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
/* 海报容器: 最大宽度500px, 保持9:16比例 */
.poster{width:min(500px,90vw);aspect-ratio:9/16;background:linear-gradient(135deg,#060b18 0%,#0f172a 40%,#1a0a2e 100%);border-radius:20px;padding:10% 8%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center}
.floating{position:absolute;color:rgba(251,191,36,0.05);font-size:clamp(10px,2vw,16px);font-family:monospace;font-weight:700;animation:float 20s linear infinite;pointer-events:none}
@keyframes float{0%{transform:translateY(105%) rotate(0)}100%{transform:translateY(-5%) rotate(360deg)}}
.badge{display:inline-block;padding:clamp(4px,1.5vw,10px) clamp(12px,4vw,30px);border:1px solid rgba(251,191,36,0.3);border-radius:50px;background:rgba(251,191,36,0.08);color:#fbbf24;font-size:clamp(10px,3vw,18px);font-weight:700;letter-spacing:2px;margin-bottom:clamp(16px,5vw,40px)}
h1{font-size:clamp(28px,10vw,64px);font-weight:900;line-height:1.15;margin-bottom:clamp(12px,3vw,24px);background:linear-gradient(180deg,#fff 0%,#fbbf24 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#94a3b8;font-size:clamp(12px,3.5vw,22px);margin-bottom:clamp(20px,6vw,50px);line-height:1.5}
.features{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,16px);margin-bottom:clamp(16px,5vw,40px)}
.feat{padding:clamp(10px,3vw,20px);border:1px solid rgba(148,163,184,0.12);border-radius:12px;background:rgba(15,23,42,0.6);text-align:left;display:flex;gap:clamp(6px,2vw,14px);align-items:flex-start}
.feat-icon{font-size:clamp(18px,5vw,34px);flex-shrink:0}
.feat h3{color:#fff;font-size:clamp(11px,3vw,20px);margin-bottom:3px}
.feat p{color:#64748b;font-size:clamp(9px,2.2vw,15px);line-height:1.4}
.price-tag{display:inline-block;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0f172a;font-size:clamp(12px,3.5vw,24px);font-weight:900;padding:clamp(8px,2vw,16px) clamp(16px,5vw,36px);border-radius:50px;margin-bottom:clamp(16px,4vw,36px)}
.cta{display:inline-block;background:#fbbf24;color:#0f172a;font-weight:900;font-size:clamp(14px,4vw,28px);padding:clamp(10px,3vw,22px) clamp(24px,7vw,60px);border-radius:16px;text-decoration:none;box-shadow:0 6px 30px rgba(251,191,36,0.3)}
.url{color:#64748b;font-size:clamp(11px,2.5vw,20px);margin-top:clamp(12px,3vw,24px);letter-spacing:1px}
</style></head><body>
<div class="poster">
<div class="floating" style="left:3%">E=mc²</div><div class="floating" style="left:18%;animation-delay:-6s">iħ∂ψ/∂t=Hψ</div><div class="floating" style="left:35%;animation-delay:-12s">∇×E=-∂B/∂t</div><div class="floating" style="left:50%;animation-delay:-4s">S=k·logW</div><div class="floating" style="left:65%;animation-delay:-16s">e^(iπ)+1=0</div><div class="floating" style="left:82%;animation-delay:-8s">F=ma</div>
<div style="position:relative;z-index:10">
<div class="badge">🚀 TIKTOK · INSTAGRAM · YOUTUBE · TELEGRAM</div>
<h1>让你的社交媒体<br>火速出圈</h1>
<p class="subtitle">粉丝 · 点赞 · 播放量 · 评论 · 转发<br>全平台覆盖 秒级交付 无需密码</p>
<div class="features">
<div class="feat"><div class="feat-icon">⚡</div><div><h3>秒级自动交付</h3><p>下单后秒级启动</p></div></div>
<div class="feat"><div class="feat-icon">💎</div><div><h3>全网最低价</h3><p id="tiktokPrice">TikTok千粉 ¥--/千</p></div></div>
<div class="feat"><div class="feat-icon">🔒</div><div><h3>安全无需密码</h3><p>只要链接 不要密码</p></div></div>
<div class="feat"><div class="feat-icon">🛡️</div><div><h3>独立IP节点</h3><p>跨境防封必备</p></div></div>
</div>
<div class="price-tag" id="livePrice">TikTok千粉最低 ¥--/千</div><br>
<div class="cta">⚡ 立即注册体验</div>
<div class="url">xnow.taikon.top</div>
</div>
</div>
<script>
(async function(){
  try {
    const r = await fetch('/api/services/public');
    const d = await r.json();
    if (d.status==='success' && Array.isArray(d.data)) {
      const tiktok = d.data.filter(s => (s.category||'').toLowerCase().includes('tiktok - 刷粉') && parseFloat(s.rate)>0 && parseFloat(s.rate)<100);
      if (tiktok.length > 0) {
        tiktok.sort((a,b) => parseFloat(a.rate) - parseFloat(b.rate));
        const p = tiktok[0].sell_price.toFixed(2);
        document.getElementById('livePrice').textContent = 'TikTok千粉最低 ¥'+p+'/千';
        document.getElementById('tiktokPrice').textContent = 'TikTok千粉 ¥'+p+'/千';
      }
    }
  } catch(e) {}
})();
</script>
</body></html>
