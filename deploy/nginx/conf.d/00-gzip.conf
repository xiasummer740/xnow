# 压缩（api JSON / JS / CSS / 文本）
# ---------------------------------------------------------------------------
# 为什么需要：
#   `/api/services/public` 在生产上返回 **2809 条服务、714,777 字节**（2026-11-03 实测）。
#   Cloudflare 边缘会自己压（带 Accept-Encoding 时返回 `Content-Encoding: br`，实测 53KB），
#   所以**浏览器到 CF 那一段本来就没问题**。
#   但「源站 → CF」这一段是明文回源：nginx 不开 gzip，CF 每次回源都要吃掉完整 714KB，
#   直接抬高了 TTFB（实测首字节 1.45 秒里有一部分就是这个）。这一段只能由源站压。
#
# ⚠️ 别把 png/jpg/woff 之类加进 gzip_types：它们本身已压缩，再压只白烧 CPU。
#
# 用法：复制到 /etc/nginx/conf.d/00-gzip.conf（http 上下文，全站生效）
#      不重启也可生效：`nginx -t && nginx -s reload`
#
# ⚠️ 这里**故意不写 `gzip on;`**：
#   conf.d/*.conf 被 include 在 http 块里，而绝大多数环境的 nginx.conf 已经有一行
#   `gzip on;` —— 同一个块里重复写 flag 类指令，nginx 会直接
#   `[emerg] "gzip" directive is duplicate` 起不来（2026-11-03 在生产上真踩了一次）。
#   真正缺的从来不是 gzip on，而是被注释掉的 gzip_types（默认只压 text/html），
#   所以这里只补后面几行。安装时若 nginx.conf 确实没有 gzip on，另行补上。
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/xml
    application/xhtml+xml
    application/rss+xml
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;
