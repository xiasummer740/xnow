# Cloudflare Flexible 兜底（:80 段专用）
# ---------------------------------------------------------------------------
# 由 install.sh 写入 /etc/nginx/snippets/xnow-flex-80.conf，
# 分站 vhost 由 server/src/utils/siteDomain.js 的 writeVhost() 按存在性 include。
#
# 🔴 2026-11-03 事故：Cloudflare 被从 Full 切成 Flexible（CF→源站走 :80）后，
#    「:80 无条件 301 到 https」与「浏览器 → CF 走 https」形成**无限跳转**：
#      浏览器 → CF(https) → 源站(:80) → 301 https → 浏览器 → CF(https) → ……
#    全站打不开约 8 小时，而且 CF 把那条自指 301 缓存下来（必须 Purge Everything 才好）。
#
# 这里的做法（2026-11-03 二次修正）：
#   · 只要请求带 `CF-Connecting-IP`（= 一定是 CF 的回源，直连访客伪造不了，
#     因为下面转发时用的是**已还原的真实 IP**，而 realip 只采信 CF 网段来的连接）
#     → 本地转发到 127.0.0.1:443，内容原样返回（证书校验关掉：源站是自签，CF 也是这么连的）；
#   · 真·直连 http 的访客（不带该头）→ 仍然 301，行为与改造前完全一致；
#   · 转发时把 :80 段已还原的真实客户端 IP 塞回 CF-Connecting-IP，
#     配合 xnow-cf-realip.conf 里的 `set_real_ip_from 127.0.0.1;` 保住真实 IP。
#
# ⚠️ 为什么不用 `$http_x_forwarded_proto != "https"`（第一版就是这么写的，在线翻过车）：
#   实测 CF 有些边缘节点回源时**不发** X-Forwarded-Proto（或发 http），
#     → 被误判成「直连访客」→ 418 → 301 → 又把 301 返回给浏览器 → 循环照旧。
#     2026-11-03 12:55 的访问日志里 `GET /api/services 301`（来源 104.22.x.x = CF）就是这条。
#   CF-Connecting-IP 是 CF 回源的**必带头**，判它才是稳的。
#
# 正式修法仍然是：Cloudflare → SSL/TLS → Overview → **改回 Full**。
#   （也绝不能改成 Full (strict)：源站是自签证书，strict 会立刻全站 502。）
# 改回 Full 之后本文件无害：CF 不再回源 :80，这段逻辑不会被走到。
#
# 用法（在 :80 的 server 块内，替换原来的 `location / { return 301 ...; }`）：
#     include /etc/nginx/snippets/xnow-flex-80.conf;
location / {
    # 不带 CF 标记 = 真·直连 http 访客 → 跳 https
    if ($http_cf_connecting_ip = "") {
        return 418;
    }
    proxy_pass https://127.0.0.1:443;
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # 把本段还原出的真实客户端 IP 传给本地 443（443 侧信任 127.0.0.1）
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_read_timeout 300s;
}
# 418 = 不是 CF 回源的 https 请求 → 老老实实跳 https
error_page 418 = @xnow_force_https;
location @xnow_force_https {
    return 301 https://$host$request_uri;
}
