# 🛡 通配兜底（95 期）
#
# 为什么要这个文件：
#   *.taikon.top 是泛解析（Cloudflare），任何没配 vhost 的子域名都会落到
#   「默认 server」→ 用户看到的是**主站/平台**。
#   后果：分站改名 / 过期 / 被删之后，客户收藏的旧域名会跳到平台主站，
#   等于把「平台」暴露给分站客户 —— 违反红线「客户永远不知道主站存在」。
#   实测：修复前 fresh-never-visited-95.taikon.top 返回主站，19 处 XNOW。
#
# 三个 server 块：
#   ① 80 端口：主站自己的域名照旧 301 到 HTTPS
#      ⚠️ 必须有：80 上主站本来靠 default_server 兜着，一旦出现 *.taikon.top
#         通配块，xnow.taikon.top 会优先匹配通配 → 变 404 →
#         若 Cloudflare 走 Flexible(HTTP) 主站立刻全站挂。
#   ② 80 端口：其它所有 *.taikon.top → 中性 404
#   ③ 443 端口：其它所有 *.taikon.top → 中性 404
#      （Cloudflare 是连源站 443 的，只改 80 挡不住 —— 实测踩过）
#
# 为什么用通配而不是 default_server：
#   nginx 匹配优先级 = 精确 > 最长通配 > default_server。
#   通配只影响「没有站点占用的子域名」，主站与每个分站的精确 vhost 完全不受影响。
#   证书沿用 beta 块在用的自签证书（Cloudflare 不是 Full strict，接受自签）。
server {
    listen 80;
    server_name xnow.taikon.top taikon.top www.taikon.top;

    # ACME 挑战仍然放行（证书续期要用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name *.taikon.top *.xnow.taikon.top;
    default_type text/html;
    return 404 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面不存在</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#9aa4b2;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}div{text-align:center;padding:24px}h1{font-size:20px;margin:0 0 8px;color:#e5e7eb}p{font-size:13px;margin:0;line-height:1.7}</style></head><body><div><h1>这个地址暂时没有内容</h1><p>如果你是访客：可能是链接输错了，或者这个站点已经关闭。<br>如果你是站长：请检查自己的域名是否还在有效期内。</p></div></body></html>';
}

server {
    listen 443 ssl http2;
    server_name *.taikon.top *.xnow.taikon.top;

    ssl_certificate     /etc/nginx/ssl/xnow.crt;
    ssl_certificate_key /etc/nginx/ssl/xnow.key;

    default_type text/html;
    return 404 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面不存在</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#9aa4b2;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}div{text-align:center;padding:24px}h1{font-size:20px;margin:0 0 8px;color:#e5e7eb}p{font-size:13px;margin:0;line-height:1.7}</style></head><body><div><h1>这个地址暂时没有内容</h1><p>如果你是访客：可能是链接输错了，或者这个站点已经关闭。<br>如果你是站长：请检查自己的域名是否还在有效期内。</p></div></body></html>';
}

# ⚠️ 上一步把 *.xnow.taikon.top 也纳进来了，配套要求：
#    /etc/nginx/sites-enabled/xnow-beta 的 server_name 里必须去掉 *.xnow.taikon.top，
#    否则那条通配更长、优先级更高，未知的 xnow 子域名仍会落到 Beta（串库）。
#    这一步由 deploy/sites/fix-unknown-host.sh 完成，deploy-prod.sh 的第 6 步会调用它。
